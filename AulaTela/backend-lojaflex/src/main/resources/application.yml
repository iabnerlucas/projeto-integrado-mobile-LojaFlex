server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: backend-lojaflex

  datasource:
    url: jdbc:mysql://localhost:3306/db_lojaflex?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: "12345"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    root: INFO
    com.lojaflex.backend: DEBUG
